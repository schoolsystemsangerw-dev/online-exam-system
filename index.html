<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="app.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- Header Navigation -->
    <header class="bg-blue-700 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-2xl font-bold">Online Exam Portal</h1>
        <div id="auth-status" class="text-sm">Not Signed In</div>
    </header>

    <main class="max-w-6xl mx-auto my-8 p-4">

        <!-- AUTH SECTION -->
        <section id="auth-section" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-4 text-center">Sign In</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium">Email</label>
                    <input type="email" id="email" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium">Password</label>
                    <input type="password" id="password" required class="w-full border p-2 rounded mt-1 focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700">Login</button>
            </form>
        </section>

        <!-- TEACHER DASHBOARD -->
        <section id="teacher-dashboard" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-blue-700 mb-4">Upload & Publish New Exam</h2>
                <form id="create-exam-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium">Exam Title</label>
                        <input type="text" id="exam-title" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Subject</label>
                        <input type="text" id="exam-subject" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Class Name</label>
                        <input type="text" id="exam-class" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Total Marks</label>
                        <input type="number" id="exam-marks" value="100" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Submission Deadline</label>
                        <input type="datetime-local" id="exam-deadline" required class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-medium">Upload Exam PDF</label>
                        <input type="file" id="exam-file" accept=".pdf" required class="w-full border p-1 rounded">
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded font-semibold hover:bg-green-700">Publish Exam</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- STUDENT DASHBOARD -->
        <section id="student-dashboard" class="hidden space-y-8">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h2 class="text-2xl font-bold text-blue-700 mb-4">Available Examinations</h2>
                <div id="student-exams-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <p class="text-gray-500">Loading exams...</p>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
